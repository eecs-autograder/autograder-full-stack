name: Finish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for release'
        required: true
      set_as_latest:
        description: 'Set to the string "true" to also update the `latest` tag'
        required: false

jobs:
  full-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    steps:
      # See https://github.com/organizations/eecs-autograder/settings/apps
      # and https://github.com/orgs/community/discussions/25305#discussioncomment-8256560
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: |
            autograder-full-stack
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # fetch all branch and tag history
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Create or checkout release branch
        id: make-branch
        run: |
          branch=$(./dev_scripts/ci/release_branch_from_version.sh "${{ inputs.version }}")
          git checkout -b $branch --track origin/$branch || git checkout -b $branch || git checkout $branch
          git push -u origin $branch || echo "Remote branch already exists"
          echo "release_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: 'Update submodules'
        run: |
          git config --file=.gitmodules submodule.ag-website-vue.branch ${{ steps.make-branch.outputs.release_branch }}
          git config --file=.gitmodules submodule.autograder-server.branch ${{ steps.make-branch.outputs.release_branch }}

          git submodule update --remote --recursive
          git add -u
          if git commit -m "Update submodule"; then
            git push
          else
            echo "Submodules already updated"
          fi

      - name: Commit and tag the Release
        run: |
          git commit --allow-empty -m "Version ${{ inputs.version }}"
          git tag
          git tag ${{ inputs.version }}
          git push
          git push --tags

          if test "${{ inputs.set_as_latest }}" == "true"; then
            git tag latest
            git push --tags --force
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh release create
          "${{ inputs.version }}"
          --repo "$GITHUB_REPOSITORY"
          --notes ""
